name: phase1a-validation

on:
  push:
    branches: [phase1a-validation-gate, phase1a-v6-review-resolution, phase1a-final-preflight]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Compile Phase 1A Python
        run: python -m compileall trading/quantitative-trading/src trading/quantitative-trading/tests
      - name: Test inference
        run: |
          cd trading/quantitative-trading
          python -m pytest -q tests/test_phase1a_inference.py
      - name: Test PIT
        run: |
          cd trading/quantitative-trading
          python -m pytest -q tests/test_phase1a_pit.py
      - name: Test accounting
        run: |
          cd trading/quantitative-trading
          python -m pytest -q tests/test_phase1a_accounting.py
      - name: Test historical orchestration and P6 fail-closed gate
        run: |
          cd trading/quantitative-trading
          python -m pytest -q tests/test_phase1b_historical.py tests/test_phase1a_preflight_manifest.py tests/test_phase1b_simulation.py tests/test_phase1b_engine_integration.py tests/test_phase1b_corporate_action_integration.py
      - name: Test Gate 2
        run: |
          cd trading/quantitative-trading
          python -m pytest -q tests/test_phase1a_gate2.py
      - name: Test Gate 3
        run: |
          cd trading/quantitative-trading
          python -m pytest -q tests/test_phase1a_gate3.py
      - name: Test Gate 4
        run: |
          cd trading/quantitative-trading
          python -m pytest -q tests/test_phase1a_gate4.py
      - name: Test Gate 5
        run: |
          cd trading/quantitative-trading
          python -m pytest -q tests/test_phase1a_gate5.py
      - name: Test Gate 6
        run: |
          cd trading/quantitative-trading
          python -m pytest -q tests/test_phase1a_gate6.py
      - name: Test final contract
        run: |
          cd trading/quantitative-trading
          python -m pytest -q tests/test_phase1a_preflight_contract.py
      - name: Test membership reconciliation
        run: |
          cd trading/quantitative-trading
          python -m pytest -q tests/test_phase1a_p4_membership.py
